databaseChangeLog:
  - changeSet:
      id: 1
      author: arsnova
      labels: data,user,room,announcement,qna
      runAlways: true
      comment: Load data fixtures for development
      changes:
        - loadUpdateData:
            schemaName: user
            tableName: user
            primaryKey: id
            file: db/data-dev/user/user.csv
        - loadUpdateData:
            schemaName: user
            tableName: user_role_mapping
            primaryKey: user_id,role_id
            file: db/data-dev/user/user_role_mapping.csv
        - loadUpdateData:
            schemaName: room
            tableName: room
            primaryKey: id
            file: db/data-dev/room/room.csv
        - loadUpdateData:
            schemaName: room
            tableName: membership
            primaryKey: room_id,user_id
            file: db/data-dev/room/membership.csv
        - loadUpdateData:
            schemaName: announcement
            tableName: announcement
            primaryKey: id
            file: db/data-dev/announcement/announcement.csv
        - loadUpdateData:
            schemaName: qna
            tableName: qna
            primaryKey: id
            file: db/data-dev/qna/qna.csv
        - loadUpdateData:
            schemaName: qna
            tableName: post
            primaryKey: id
            file: db/data-dev/qna/post.csv
        - loadUpdateData:
            schemaName: qna
            tableName: tag
            primaryKey: id
            file: db/data-dev/qna/tag.csv
        - loadUpdateData:
            schemaName: questionnaire
            tableName: questionnaire
            primaryKey: id
            file: db/data-dev/questionnaire/questionnaire.csv
        - loadUpdateData:
            schemaName: questionnaire
            tableName: content
            primaryKey: id
            file: db/data-dev/questionnaire/content.csv
        - loadUpdateData:
            schemaName: questionnaire
            tableName: round
            primaryKey: id
            file: db/data-dev/questionnaire/round.csv
        - loadUpdateData:
            schemaName: questionnaire
            tableName: template
            primaryKey: id
            file: db/data-dev/questionnaire/template.csv
        - loadUpdateData:
            schemaName: questionnaire
            tableName: template_tag
            primaryKey: id
            file: db/data-dev/questionnaire/template_tag.csv
        # A table of key columns only leaves loadUpdateData nothing to update.
        - sql: >-
            INSERT INTO "questionnaire"."template_tag_mapping" (template_id, tag_id)
            VALUES ('221964c6-ce39-48c8-8bd7-566a7017fe33', '30daefdf-0622-43cd-af18-9d3dfe29684f')
            ON CONFLICT DO NOTHING
