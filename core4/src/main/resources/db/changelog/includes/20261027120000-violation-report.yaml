databaseChangeLog:
  - changeSet:
      id: 1
      author: arsnova
      labels: ddl,violation_report
      comment: Create initial definitions for violation report module
      changes:
        - sql: CREATE SCHEMA "violation_report"
      rollback:
        - sql: DROP SCHEMA "violation_report"
  - changeSet:
      id: 2
      author: arsnova
      labels: ddl,violation_report
      context: default
      comment: Create the table of violation reports
      modifySql:
        replace:
          replace: GENERATED_UUIDV7_TIMESTAMP
          with: timestamp with time zone GENERATED ALWAYS AS (uuid_extract_timestamp(id))
      changes:
        - sql: CREATE TYPE "violation_report_reason" AS ENUM ('ADVERTISING', 'COPYRIGHT', 'DISINFORMATION', 'HATE_SPEECH', 'OTHER')
        - sql: CREATE TYPE "violation_report_decision" AS ENUM ('INVALID', 'REMOVAL')
        - createTable:
            schemaName: violation_report
            tableName: violation_report
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: version
                  type: smallint
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: target_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: target_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: reason
                  type: violation_report_reason
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
                  constraints:
                    nullable: false
              - column:
                  name: decision
                  type: violation_report_decision
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    foreignKeyName: created_by_fkey
                    references: '"user"."user"(id)'
                    nullable: false
              - column:
                  name: created_at
                  type: GENERATED_UUIDV7_TIMESTAMP
              - column:
                  name: updated_by
                  type: uuid
                  constraints:
                    foreignKeyName: updated_by_fkey
                    references: '"user"."user"(id)'
              - column:
                  name: updated_at
                  type: timestamp with time zone
        - sql: CREATE INDEX "violation_report_decision_id_idx" ON "violation_report"."violation_report" (decision, id DESC)
