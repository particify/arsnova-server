services:
  apisix:
    restart: $RESTART_MODE
    volumes:
      # Both relative to the deployment root, which particifyctl pins as the project directory, and
      # both generated by `./particifyctl update-gateway`: the configuration file carries the
      # settings which depend on the host and the certificates rather than on the release, and the
      # routes file inlines the certificates themselves, which APISIX cannot load from a path.
      - ./apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
