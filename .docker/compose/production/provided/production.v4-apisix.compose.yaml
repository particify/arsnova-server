services:
  apisix:
    restart: $RESTART_MODE
    volumes:
      # Relative to the deployment root, which particifyctl pins as the project directory.
      # A symlink, so that nothing outside the release is named: a release ships it alone.
      - ./provided/apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
      # Generated by `./particifyctl update-gateway`, which inlines the certificates APISIX cannot
      # load from a path.
      - ./apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
