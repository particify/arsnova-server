services:
  apisix:
    restart: $RESTART_MODE
    volumes:
      # Relative to this directory, which Docker Compose uses as the project directory here.
      # A symlink, so that nothing outside this directory is named: a release ships this directory
      # alone.
      - ./config.yaml:/usr/local/apisix/conf/config.yaml:ro
      # Generated by `./particifyctl update-gateway`, which inlines the certificates APISIX cannot
      # load from a path.
      - ./apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
