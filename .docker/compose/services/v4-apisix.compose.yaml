services:
  apisix:
    image: apache/apisix:3.19.0-debian@sha256:9a7e45dc943fbf10ec916d1232bae4cda9302ae28a4696cfb83c2da01d261141
    # Docker Compose merges port lists by union rather than replacing them, so these cannot be
    # overridden from production.v4-apisix.compose.yaml -- the published ports have to be
    # parameterised here. The development environment pins both in its own base.env, because
    # rootless Podman cannot bind below 1024.
    ports:
      - $PORT:9080
      - $HTTPS_PORT:9443
    # The configuration mounts are not here: Docker Compose resolves a relative source against the
    # project directory, which is this directory under particifyctl and the repository root under
    # the development pdk, so the paths cannot be shared.
    # Each environment's overlay supplies them -- production.v4-apisix.compose.yaml and
    # development/devcontainer.v4-apisix.compose.yaml.
    extra_hosts:
      - host.containers.internal:host-gateway
