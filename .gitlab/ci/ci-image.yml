build_ci_image:
  stage: deploy
  needs: []
  image:
    name: quay.io/podman/stable:v5.8.7-immutable@sha256:f345d8d4fddea244d3a1ced27bcec82d14cc9e32cb5ead7f5882b0baf59dc8b0
  variables:
    CONTAINER_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/openjdk-podman
    CONTAINER_TAG: 25
    CONTAINER_CONTEXT: $CI_PROJECT_DIR/.docker/images/openjdk-podman
    CONTAINERFILE: $CI_PROJECT_DIR/.docker/images/openjdk-podman/Containerfile
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - .docker/images/openjdk-podman/**/*
    - when: manual
  allow_failure: true
  interruptible: false
  before_script:
    - date
  script:
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - podman build
      --tag "$CONTAINER_IMAGE:$CONTAINER_TAG"
      --file "$CONTAINERFILE"
      "$CONTAINER_CONTEXT"
    - podman push "$CONTAINER_IMAGE:$CONTAINER_TAG"
