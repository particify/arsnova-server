variables:
  BUILD_DIR: lib
  # renovate: datasource=npm depName=corepack
  COREPACK_VERSION: 0.36.0
  YARN_CACHE_FOLDER: .yarn-cache
  YARN_ENABLE_GLOBAL_CACHE: "false"

# Override rules from parent CI config
workflow:
  rules:
    - when: always

default:
  interruptible: true
  image: node:26.13.0-alpine@sha256:c6ad9e9c1d80f6eb607c26b4b0a132ff7a2344fad1c78ea3baa2a7d4c8de6d94
  before_script:
    - echo "$PROJECT"
    - cd "$PROJECT"
    - export PATH="`pwd`/node_modules/.bin:$PATH"
    - npm install --global "corepack@$COREPACK_VERSION"
    - corepack enable
    - date
  after_script:
    - date

.yarn_cache: &yarn_cache
  key: yarn-cache
  paths:
    - $PROJECT/node_modules
    - $PROJECT/$YARN_CACHE_FOLDER

yarn_populate_cache:
  stage: .pre
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_ID
      when: never
    - changes:
        - $PROJECT/package.json
        - $PROJECT/yarn.lock
      when: on_success
    - when: manual
  # allow_failure: Do not block pipeline if job is created but not run.
  allow_failure: true
  cache:
    <<: *yarn_cache
    policy: pull-push
  script:
    - echo Populating cache...
    - umask 0000
    - yarn install --immutable

yarn_install:
  stage: .pre
  artifacts:
    expire_in: 12 hours
    paths:
      - $PROJECT/node_modules
  cache:
    <<: *yarn_cache
    policy: pull
  script:
    - umask 0000
    - yarn install --immutable

eslint:
  stage: test
  needs:
    - yarn_install
  allow_failure: false
  script:
    - yarn eslint .

docker_image:
  stage: deploy
  dependencies: []
  image:
    name: gcr.io/kaniko-project/executor:debug@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    entrypoint: [""]
  # The default before_script needs npm, which the Kaniko image lacks.
  before_script:
    - date
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: on_success
      variables:
        DOCKER_TAG: next
    - when: manual
      variables:
        DOCKER_TAG: dev-$CI_COMMIT_REF_SLUG
  variables:
    DOCKER_IMAGE: $CI_REGISTRY/$CI_PROJECT_PATH/$PROJECT
    KANIKO_CONTEXT: $CI_PROJECT_DIR/$PROJECT
    KANIKO_DOCKERFILE: $CI_PROJECT_DIR/$PROJECT/.docker/Dockerfile
  allow_failure: true
  interruptible: false
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor
      --context "$KANIKO_CONTEXT"
      --dockerfile "$KANIKO_DOCKERFILE"
      --destination "$DOCKER_IMAGE:$DOCKER_TAG"
      --build-arg "BUILD_DIR=`echo $BUILD_DIR`"
      --build-arg "COREPACK_VERSION=`echo $COREPACK_VERSION`"
